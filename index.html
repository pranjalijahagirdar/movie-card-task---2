    <div class="backDrop formClose" id="backDrop"></div>
        <form id="movieForm">
            <div class="card">
                <div class="card-header d-flex justify-content-between"> 
                    <h5>Add Movie</h5>
                    <i class="fa-solid fa-xmark  fa-2x formClose" id="closeForm" role="button"></i>
                </div>
                <div class="card-body">
                    <div class="form-group">
                        <label for="movieName">Enter Movie Name</label>
                        <input required type="text" class="form-control" id="movieName">
                    </div>
                    <div class="form-group">
                        <label for="movieImg">Enter movie image</label>
                        <input required type="text" class="form-control" id="movieImg">
                    </div>
                    <div class="form-group">
                        <label for="movieDesciption">Enter movie Desciption</label>
                        <textarea required type="text" class="form-control" id="movieDesciption"></textarea>
                    </div>
                    <div class="form-group">
                        <label for="movieRating">Enter movie Rating</label>
                        <select id="movieRating" class="form-control">
                            <option value="1">1</option>
                            <option value="2">2</option>
                            <option value="3">3</option>
                            <option value="4">4</option>
                            <option value="5">5</option>
                            <option value="6">6</option>
                            <option value="7">7</option>
                            <option value="8">8</option>
                            <option value="9">9</option>
                            <option value="10">10</option>
                        </select>
                    </div>
                </div>
                <div class="card-footer d-flex justify-content-between">
                    <button type="submit" id="addMoviebtn" class="btn btn-sm net-sec-btn">Add Movie</button>
                    <button type="button" id="updateMoviebtn" class="btn btn-sm net-sec-btn
                     d-none">Update Movie</button>
                    <button type="button" class="btn btn-sm net-pri-btn formClose">Close</button>
                </div>
            </div>
        </form>
